name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n 1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          "$SDKMANAGER" --list_installed | head -n 40

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/benthic9-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: benthic9-debug-apk
          path: artifacts/benthic9-debug.apk
          retention-days: 30

  release:
    name: Attach APK to release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: apk
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: benthic9-debug-apk
          path: artifacts

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/benthic9-debug.apk
          fail_on_unmatched_files: true
